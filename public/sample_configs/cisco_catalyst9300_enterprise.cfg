!
version 17.6
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CORE-SW-CAT9300-01
!
boot-start-marker
boot system flash:cat9k_iosxe.17.06.05.SPA.bin
boot-end-marker
!
vrf definition Mgmt-vrf
 !
 address-family ipv4
 exit-address-family
 !
 address-family ipv6
 exit-address-family
!
logging buffered 64000 informational
no logging console
enable secret 9 $9$vDqY$y6T87M...4f9811ae23d57b1
!
aaa new-model
!
aaa authentication login default local
aaa authentication enable default enable
aaa authorization exec default local 
aaa session-id common
!
ip routing
ip cef
no ip domain-lookup
ip domain name corp.defense.gov
ip name-server 10.100.1.10 10.100.1.11
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
snmp-server community public RO
snmp-server community secretmgr RW 10
snmp-server location BLDG-4-RACK-02-ENTERPRISE
snmp-server contact netops@corp.defense.gov
snmp-server enable traps snmp authentication linkdown linkup
!
vlan 10
 name CORPORATE-DATA
!
vlan 20
 name VOICE-OVER-IP
!
vlan 30
 name GUEST-WIFI
!
vlan 99
 name OOB-MANAGEMENT
!
interface GigabitEthernet1/0/1
 description UPLINK-TO-WAN-PRIMARY (Edge-ISP-A)
 ip address 198.51.100.2 255.255.255.252
 negotiation auto
 no shutdown
!
interface GigabitEthernet1/0/2
 description UPLINK-TO-WAN-SECONDARY (Edge-ISP-B)
 ip address 203.0.113.14 255.255.255.252
 negotiation auto
 no shutdown
!
interface GigabitEthernet1/0/3
 description TRUNK-TO-DISTRIBUTION-02
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface GigabitEthernet1/0/4
 description ACCESS-WORKSTATION-CEO
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/0/48
 description SPAN-PORT-IDS-TAP
 no shutdown
!
interface Vlan10
 description GATEWAY-DATA
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface Vlan99
 description GATEWAY-MGMT-OOB
 ip address 10.250.1.1 255.255.255.0
 no shutdown
!
router ospf 100
 router-id 10.250.1.1
 passive-interface default
 no passive-interface GigabitEthernet1/0/1
 network 10.250.1.0 0.0.0.255 area 0
 network 198.51.100.0 0.0.0.3 area 0
!
router bgp 65001
 bgp router-id 10.250.1.1
 bgp log-neighbor-changes
 neighbor 198.51.100.1 remote-as 64512
 neighbor 198.51.100.1 description ISP-A-CORE
!
ip http server
no ip http secure-server
!
ntp server 10.100.1.50
ntp server 10.100.1.51
!
access-list 10 permit 10.250.1.0 0.0.0.255
access-list 10 deny any
!
line con 0
 exec-timeout 15 0
 stopbits 2
 logging synchronous
line vty 0 4
 transport input all
 exec-timeout 0 0
 login local
line vty 5 15
 transport input all
 exec-timeout 0 0
 login local
!
end
