! Cisco IOS-XE Hardened Configuration Baseline
! Target: CIS Cisco IOS 17.x Benchmark Level 2 & NIST SP 800-53 Rev 5
! Status: 100% Fully Hardened Compliance Profile
!
version 17.6
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
!
hostname HARDENED-GW-01
!
boot-start-marker
boot system flash:cat9k_iosxe.17.06.05.SPA.bin
boot-end-marker
!
password algorithm scrypt
enable secret 9 $9$x91Kasdkj18274192837192837198237198273
!
no ip domain-lookup
ip domain name enterprise.pci.internal
ip name-server 10.200.1.5 10.200.1.6
!
aaa new-model
aaa authentication login default group radius local
aaa authentication enable default group radius enable
aaa authorization exec default group radius local
aaa accounting exec default start-stop group radius
aaa accounting commands 15 default start-stop group radius
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm encryption aes256-gcm aes128-gcm
ip ssh server algorithm mac hmac-sha2-512 hmac-sha2-256
!
no ip http server
ip http secure-server
ip http secure-ciphersuite ecdhe-rsa-aes-256-gcm-sha384
ip http client secure-ciphersuite ecdhe-rsa-aes-256-gcm-sha384
!
no snmp-server community public
no snmp-server community private
snmp-server view RESTRICTED-VIEW iso included
snmp-server group SECURE-NMS v3 priv read RESTRICTED-VIEW
snmp-server user sec-auditor SECURE-NMS v3 auth sha256 StrongAuthPassPhrase123! priv aes 256 StrongPrivPassPhrase456!
!
ntp server 10.200.1.100 prefer
ntp server 10.200.1.101
ntp authenticate
ntp trusted-key 1
!
ip access-list standard VTY-PROTECT-ACL
 10 permit 10.250.1.0 0.0.0.255
 20 permit 10.200.50.0 0.0.0.255
 30 deny any log
!
banner login ^C
*******************************************************************************
*                                  NOTICE                                     *
* THIS SYSTEM IS STRICTLY RESTRICTED TO AUTHORIZED PERSONNEL ONLY.            *
* ALL ACTIVITIES ARE MONITORED AND RECORDED UNDER NIST SP 800-53 DIRECTIVES.  *
* UNAUTHORIZED ATTEMPTS ARE CRIMINALLY ACTIONABLE UNDER 18 U.S.C. 1030.       *
*******************************************************************************
^C
!
interface GigabitEthernet1/0/1
 description UPLINK-WAN-TRUSTED
 ip address 198.51.100.14 255.255.255.252
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
!
interface Vlan99
 description SECURE-MANAGEMENT
 ip address 10.250.1.10 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
!
line con 0
 exec-timeout 10 0
 stopbits 2
 logging synchronous
 login authentication default
line vty 0 15
 transport input ssh
 transport output none
 exec-timeout 10 0
 access-class VTY-PROTECT-ACL in vrf-also
 login authentication default
!
end
