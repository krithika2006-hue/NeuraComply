## Juniper Networks Junos OS Configuration
## Device: SRX340 Services Gateway
## Version: 21.4R3-S2.4
## Architecture: Junos Security Architecture
##
version 21.4R3-S2.4;
system {
    host-name SRX340-PERIMETER-01;
    domain-name enterprise.network.net;
    time-zone America/New_York;
    root-authentication {
        encrypted-password "$6$bK3$19a28g7sh8d9f7g6s5d4f3g2h1j0k9l8";
    }
    name-server {
        10.100.1.10;
        10.100.1.11;
    }
    login {
        message "===============================================================\n  AUTHORIZED ACCESS ONLY. ALL SESSIONS ARE MONITORED AND LOGGED.  \n===============================================================";
        user netadmin {
            uid 2001;
            class super-user;
            authentication {
                ssh-rsa "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC49...";
            }
        }
    }
    services {
        ssh {
            protocol-version v2;
            max-pre-authentication-packets 10;
            rate-limit 5;
        }
        web-management {
            http {
                interface ge-0/0/0.0;
            }
        }
    }
    syslog {
        archive size 100k files 5;
        user * {
            any emergency;
        }
        host 10.100.5.50 {
            any info;
            facility-override local7;
        }
    }
    ntp {
        server 10.100.1.50 prefer;
        server 10.100.1.51;
    }
}
interfaces {
    ge-0/0/0 {
        description "WAN Uplink to Transit Provider";
        unit 0 {
            family inet {
                address 198.51.100.6/30;
            }
        }
    }
    ge-0/0/1 {
        description "Internal Trusted LAN";
        unit 0 {
            family inet {
                address 10.50.1.1/24;
            }
        }
    }
    ge-0/0/2 {
        description "DMZ Web Services";
        unit 0 {
            family inet {
                address 172.16.10.1/24;
            }
        }
    }
}
snmp {
    name "SRX340-PERIMETER-01";
    location "Datacenter Rack 12, Unit 22";
    contact "security-ops@enterprise.network.net";
    community public {
        authorization read-only;
    }
}
security {
    address-book {
        global {
            address LAN-SUBNET 10.50.1.0/24;
            address DMZ-SUBNET 172.16.10.0/24;
        }
    }
    zones {
        security-zone trust {
            interfaces {
                ge-0/0/1.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                            ssh;
                        }
                    }
                }
            }
        }
        security-zone untrust {
            screen untrust-screen;
            interfaces {
                ge-0/0/0.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                        }
                    }
                }
            }
        }
        security-zone dmz {
            interfaces {
                ge-0/0/2.0;
            }
        }
    }
    policies {
        from-zone trust to-zone untrust {
            policy default-permit {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }
}
