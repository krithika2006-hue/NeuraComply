# Fortinet FortiOS Configuration
# Model: FortiGate-100F
# Version: FortiOS v7.2.5 build1517 (GA)
#
config system global
    set hostname "FGT100F-CAMPUS-01"
    set timezone 04
    set admin-sport 443
    set admin-ssh-port 22
    set admin-telnet disable
    set strong-crypto enable
    set pre-login-banner enable
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 198.51.100.10 255.255.255.252
        set allowaccess ping
        set type physical
        set description "WAN-Primary-Uplink"
    next
    edit "port2"
        set vdom "root"
        set ip 10.100.1.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set description "Internal-LAN"
    next
    edit "mgmt"
        set vdom "root"
        set ip 192.168.1.99 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set description "Dedicated-Management"
    next
end
config system admin
    edit "admin"
        set trusthost1 10.100.1.0 255.255.255.0
        set accprofile "super_admin"
        set vdom "root"
        set password-expire enable
    next
end
config system snmp community
    edit 1
        set name "public"
        set status enable
        config hosts
            edit 1
                set ip 10.100.1.50 255.255.255.255
            next
        end
    next
end
config firewall address
    edit "LAN_SUBNET"
        set subnet 10.100.1.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set name "Corporate-Internet-Access"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "LAN_SUBNET"
        set dstaddr "all"
        set schedule "always"
        set service "HTTPS" "HTTP" "DNS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
        set nat enable
    next
end
