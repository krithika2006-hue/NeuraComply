version: '3.7'

networks:
  aegis_fabric_net:
    name: aegis_fabric_net

volumes:
  orderer.fabric.defense.gov:
  peer0.secops.defense.gov:
  peer0.auditor.certin.gov:

services:
  orderer.fabric.defense.gov:
    image: hyperledger/fabric-orderer:2.5.9
    container_name: orderer.fabric.defense.gov
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    ports:
      - 7050:7050
    networks:
      - aegis_fabric_net

  peer0.secops.defense.gov:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.secops.defense.gov
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aegis_fabric_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_ID=peer0.secops.defense.gov
      - CORE_PEER_ADDRESS=peer0.secops.defense.gov:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.secops.defense.gov:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.secops.defense.gov:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.secops.defense.gov:7051
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 7051:7051
    networks:
      - aegis_fabric_net

  peer0.auditor.certin.gov:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.auditor.certin.gov
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aegis_fabric_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_LOCALMSPID=AuditorMSP
      - CORE_PEER_ID=peer0.auditor.certin.gov
      - CORE_PEER_ADDRESS=peer0.auditor.certin.gov:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 9051:9051
    networks:
      - aegis_fabric_net
